<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background:#f4f7fc;">

<div class="container mt-5">

    <div class="card shadow p-5">

        <h2 class="mb-4">
            Edit Project
        </h2>

        <form method="POST">

            <div class="mb-3">

                <input
                    type="text"
                    name="project_name"
                    class="form-control"
                    value="{{ project[1] }}"
                    required
                >

            </div>

            <div class="mb-3">

                <select
                    name="project_status"
                    class="form-control"
                    required
                >

                    <option {% if project[2]=='Pending' %}selected{% endif %}>
                        Pending
                    </option>

                    <option {% if project[2]=='Ongoing' %}selected{% endif %}>
                        Ongoing
                    </option>

                    <option {% if project[2]=='Completed' %}selected{% endif %}>
                        Completed
                    </option>

                </select>

            </div>

            <div class="mb-4">

                <input
                    type="date"
                    name="deadline"
                    class="form-control"
                    value="{{ project[3] }}"
                    required
                >

            </div>

            <button class="btn btn-success">
                Update Project
            </button>

        </form>

    </div>

</div>

</body>
</html>
