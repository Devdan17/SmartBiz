<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signup - SmartBiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(to right, #141e30, #243b55);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: Arial, sans-serif;
        }

        .signup-box{
            width:420px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
        }

        .signup-title{
            text-align:center;
            margin-bottom:30px;
            font-weight:bold;
            color:#243b55;
        }

        .brand{
            text-align:center;
            margin-bottom:10px;
            color:#0d6efd;
            font-size:28px;
            font-weight:bold;
        }

        .form-control{
            height:50px;
            border-radius:10px;
        }

        .btn-signup{
            width:100%;
            height:50px;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="signup-box">

        <div class="brand">
            SmartBiz
        </div>

        <h2 class="signup-title">
            Create Account
        </h2>

        <form method="POST">

            <div class="mb-3">
                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter Full Name"
                    required
                >
            </div>

            <div class="mb-3">
                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter Email"
                    required
                >
            </div>

            <div class="mb-4">
                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter Password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-signup">
                Signup
            </button>

        </form>

        <div class="text-center mt-4">

            <p>
                Already have an account?
            </p>

            <a href="/login" class="btn btn-success">
                Login
            </a>

        </div>

    </div>

</body>
</html>
