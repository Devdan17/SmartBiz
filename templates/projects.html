<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - SmartBiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body style="background:#f4f7fc;">

<div class="container mt-5">

    <h1 class="mb-4">
        Project Management
    </h1>

    <!-- Add Project Form -->
    <div class="card shadow p-4 mb-5">

        <h3 class="mb-4">
            Add New Project
        </h3>

        <form method="POST">

            <div class="mb-3">

                <input
                    type="text"
                    name="project_name"
                    class="form-control"
                    placeholder="Project Name"
                    required
                >

            </div>

            <div class="mb-3">

                <select
                    name="project_status"
                    class="form-control"
                    required
                >

                    <option value="">
                        Select Status
                    </option>

                    <option>
                        Pending
                    </option>

                    <option>
                        Ongoing
                    </option>

                    <option>
                        Completed
                    </option>

                </select>

            </div>

            <div class="mb-4">

                <input
                    type="date"
                    name="deadline"
                    class="form-control"
                    required
                >

            </div>

            <button class="btn btn-primary">
                Add Project
            </button>

        </form>

    </div>

    <!-- Projects Table -->
    <div class="card shadow p-4">

        <h3 class="mb-4">
            All Projects
        </h3>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Project Name</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

                {% for project in projects %}

                <tr>

                    <td>{{ project[0] }}</td>
                    <td>{{ project[1] }}</td>
                    <td>{{ project[2] }}</td>
                    <td>{{ project[3] }}</td>
                    <td>

                        <a href="/edit_project/{{ project[0] }}"
                        class="btn btn-warning btn-sm">
                            Edit

                        </a>

                        <a href="/delete_project/{{ project[0] }}"
                            class="btn btn-danger btn-sm"
                            onclick="return confirm('Are you sure?')">
                            Delete

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
