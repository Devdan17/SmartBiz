<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SmartBiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#f4f7fc;
            font-family: Arial, sans-serif;
        }

        .sidebar{
            height:100vh;
            background:#212529;
            color:white;
            padding:20px;
            position:fixed;
        }

        .sidebar h2{
            margin-bottom:30px;
            font-weight:bold;
        }

        .sidebar .nav-link{
            color:white;
            font-size:17px;
            padding:10px;
            border-radius:8px;
            transition:0.3s;
        }

        .sidebar .nav-link:hover{
            background:#0d6efd;
        }

        .main-content{
            margin-left:16.5%;
            padding:30px;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card h3{
            font-size:22px;
        }

        .welcome-text{
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h2>SmartBiz</h2>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a href="#" class="nav-link">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/analytics" class="nav-link">
                        Analytics
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/projects" class="nav-link">
                        Projects
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/reports" class="nav-link">
                        Reports
                    </a>
                </li>

                <li class="nav-item mt-4">
                    <a href="/logout" class="btn btn-danger w-100">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">

            <h1 class="welcome-text">
                Welcome, {{ username }}
            </h1>

            <p class="text-muted mb-5">
                Dashboard Overview
            </p>

            <!-- Top Cards -->
            <div class="row g-4">

                <div class="col-md-4">

                    <div class="card shadow p-4">

                        <h3>Total Revenue</h3>

                        <h2 class="mt-3">
                        {{ revenue_growth }}%
                        </h2>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow p-4">

                        <h3>Active Projects</h3>

                        <h2 class="mt-3">12</h2>

                    </div>

                </div>

                <div class="col-md-4">

                    <div class="card shadow p-4">

                        <h3>Total Users</h3>

                        <h2 class="mt-3">{{ total_users }}</h2>

                    </div>

                </div>

            </div>

            <!-- Charts Section -->
            <div class="row mt-5 g-4">

                <!-- Revenue Chart -->
                <div class="col-md-8">

                    <div class="card shadow p-4">

                        <h3 class="mb-4">
                            Monthly Revenue Analytics
                        </h3>

                        <canvas id="revenueChart"></canvas>

                    </div>

                </div>

                <!-- User Chart -->
                <div class="col-md-4">

                    <div class="card shadow p-4">

                        <h3 class="mb-4">
                            User Distribution
                        </h3>

                        <canvas id="userChart"></canvas>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Charts Script -->
<script>

    // Revenue Line Chart

    const revenueCtx = document.getElementById('revenueChart');

    new Chart(revenueCtx, {

        type: 'line',

        data: {

            labels: {{ months | tojson }},

            datasets: [{

    label: 'Revenue',

    data: {{ amounts | tojson }},

    borderWidth: 3,

    tension: 0.4,

    fill: true

}]
        },

        options: {
            responsive: true
        }

    });


    // User Doughnut Chart

    const userCtx = document.getElementById('userChart');

    new Chart(userCtx, {

        type: 'doughnut',

        data: {

            labels: ['Active Users', 'Inactive Users'],

            datasets: [{
                data: [320, 80],
                borderWidth: 2
            }]
        }

    });

</script>

</body>
</html>
